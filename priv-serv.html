<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Secure Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .access-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .access-card {
            background: #111;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }
        .access-card h2 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        .access-card .info {
            background: #0a0e17;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #222;
        }
        .access-card .info p {
            color: #7a8aa3;
            margin: 8px 0;
        }
        .access-card .info strong {
            color: #fff;
        }
        .access-card .info .highlight {
            color: #00ff88;
            font-weight: bold;
        }
        .access-card button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .access-card button:hover {
            background: #00ff88;
            color: #000;
        }
        .badge-owned {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .redes {
            margin-top: 40px;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #1a0a0a;
            border-radius: 10px;
            border: 1px solid #ff4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .features span {
            background: #0a0e17;
            border: 1px solid #222;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #7a8aa3;
        }
        .features span .check {
            color: #00ff88;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>SECURE CHAT</h1>
    </div>

    <div class="access-container">
        <div id="accessContent">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <div class="redes">
        <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
    </div>

    <script type="module">
        import { getCurrentUser } from './auth.js';

        const user = getCurrentUser();
        if (!user) {
            alert('Please login to access this page');
            window.location.href = 'login.html';
        }

        const API_URL = 'https://registration-remind-actor-linda.trycloudflare.com/api';

        async function checkAccess() {
            const container = document.getElementById('accessContent');

            try {
                const response = await fetch(`${API_URL}/get_inventory.php?user_id=${user.id}`);
                const data = await response.json();

                if (!data.success) {
                    container.innerHTML = `<div class="error-msg">Error: ${data.error}</div>`;
                    return;
                }

                const hasAccess = data.data.some(item => item.nombre === 'Secure Chat Access');

                if (!hasAccess) {
                    container.innerHTML = `
                        <div class="access-card">
                            <p style="color:#ff4444;font-size:1.2rem;">Access Denied</p>
                            <p style="color:#7a8aa3;">You don't have Secure Chat Access.</p>
                            <p style="color:#7a8aa3;">Go to the <a href="shop.html" style="color:#00ff88;">Shop</a> to buy it.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="access-card">
                        <span class="badge-owned">ACCESS GRANTED</span>
                        <h2>Private Encrypted Chat</h2>
                        
                        <p style="color:#7a8aa3;">The most secure and private chat for SoPrimico community.</p>

                        <div class="features">
                            <span><span class="check">+</span> End-to-end encryption</span>
                            <span><span class="check">+</span> No logs</span>
                            <span><span class="check">+</span> Anonymous</span>
                            <span><span class="check">+</span> Open source</span>
                        </div>

                        <div class="info">
                            <p><strong>Server:</strong> <span class="highlight">SOON</span></p>
                            <p><strong>Port:</strong> <span class="highlight">SOON</span></p>
                            <p><strong>Channel:</strong> <span class="highlight">SOON</span></p>
                            <p><strong>SSL Port:</strong> <span class="highlight">SOON</span> (recommended)</p>
                        </div>

                        <p style="color:#7a8aa3;font-size:0.9rem;margin-top:15px;">
                            Connect with your favorite IRC client (HexChat, WeeChat, mIRC, etc.)
                        </p>

                        <button onclick="window.location.href='https://www.hexchat.org/downloads.html'" target="_blank">
                            Download HexChat
                        </button>
                        <button onclick="window.location.href='https://weechat.org/download/'" target="_blank" style="margin-left:10px;">
                            Download WeeChat
                        </button>
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">Error loading access: ${error.message}</div>`;
            }
        }

        checkAccess();
    </script>
</body>
</html>
