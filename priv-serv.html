<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Secure Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .access-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .access-card {
            background: #111;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }
        .access-card h2 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        .access-card .info {
            background: #0a0e17;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #222;
        }
        .access-card .info p {
            color: #7a8aa3;
            margin: 8px 0;
        }
        .access-card .info strong {
            color: #fff;
        }
        .access-card .info .highlight {
            color: #00ff88;
            font-weight: bold;
        }
        .access-card button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .access-card button:hover {
            background: #00ff88;
            color: #000;
        }
        .badge-owned {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .redes {
            margin-top: 40px;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #1a0a0a;
            border-radius: 10px;
            border: 1px solid #ff4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .features span {
            background: #0a0e17;
            border: 1px solid #222;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #7a8aa3;
        }
        .features span .check {
            color: #00ff88;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>

        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
