<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Web Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .settings-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }
        .settings-card {
            background: #111;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #222;
            margin-bottom: 20px;
        }
        .settings-card h2 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        .settings-card label {
            display: block;
            color: #7a8aa3;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .settings-card select,
        .settings-card input {
            width: 100%;
            padding: 10px;
            background: #0a0e17;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .settings-card select:focus,
        .settings-card input:focus {
            border-color: #00ff88;
            outline: none;
        }
        .settings-card .preview-box {
            background: #0a0e17;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #222;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a8aa3;
            font-size: 0.9rem;
            overflow: hidden;
            position: relative;
        }
        .settings-card .preview-box img,
        .settings-card .preview-box video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            object-fit: cover;
        }
        .settings-card .btn-save {
            padding: 10px 30px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .settings-card .btn-save:hover {
            background: #00cc66;
        }
        .settings-card .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            display: block;
            background: #1a3a2e;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .message.error {
            display: block;
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .hint {
            color: #555;
            font-size: 0.8rem;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .redes {
            margin-top: 30px;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-reset:hover {
            background: #ff4444;
            color: #fff;
        }
        .btn-apply {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-left: 10px;
        }
        .btn-apply:hover {
            background: #00cc66;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>
