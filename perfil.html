<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Soprimico</title>
    <link rel="icon" type="image/png" href="js/assets/S_Soprimico.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="logo-container">
                <img src="js/assets/S_Soprimico.png" alt="Soprimico" class="logo-img">
                <span class="logo-text">SOPRIMICO</span>
            </a>
            <div class="user-wrapper">
                <button class="user-button" id="user-button">
                    <div class="user-avatar user-avatar-guest" id="user-avatar">👤</div>
                    <span class="user-name" id="user-name">Entrar</span>
                </button>
                <div class="user-dropdown" id="user-dropdown"></div>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar...">
            <div id="search-results"></div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="tools.html">Herramientas</a></li>
                <li><a href="tutorials.html">Tutoriales</a></li>
                <li><a href="classes.html">Clases</a></li>
                <li><a href="help.html">Ayuda</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" id="perfil-container">
        <div style="text-align: center; padding: 80px 20px;">
            <h1>Cargando perfil...</h1>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Soprimico. Todos los derechos reservados.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('perfil-container');
            
            // Verificar sesión
            if (!Auth.isLoggedIn()) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <h1>🔒 Acceso Restringido</h1>
                        <p style="color: var(--text-secondary); margin-bottom: 30px;">Necesitas iniciar sesión para ver tu perfil</p>
                        <button class="btn" onclick="abrirModalLogin()">Iniciar Sesión</button>
                    </div>
                `;
                return;
            }
            
            try {
                // Cargar datos
                const [perfilRes, statsRes, comprasRes, suscripcionRes] = await Promise.all([
                    Auth.fetchAuth('/api/auth/me'),
                    Auth.fetchAuth('/api/auth/stats'),
                    Auth.fetchAuth('/api/auth/compras'),
                    Auth.fetchAuth('/api/auth/suscripcion'),
                ]);
                
                const perfil = (await perfilRes.json()).usuario;
                const stats = (await statsRes.json()).stats;
                const compras = (await comprasRes.json()).compras;
                const suscripcion = (await suscripcionRes.json()).suscripcion;
                
                const formatearEuro = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n);
                
                container.innerHTML = `
                    <!-- Header del perfil -->
                    <div class="card" style="display: flex; align-items: center; gap: 30px; flex-wrap: wrap; margin-bottom: 30px;">
                        <div class="user-avatar" style="width: 100px; height: 100px; font-size: 2.5rem; background: linear-gradient(135deg, #333, #666); border: 2px solid #555;">
                            ${(perfil.nombre_completo || perfil.username).charAt(0).toUpperCase()}
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <h1 style="margin-bottom: 5px;">${perfil.nombre_completo || perfil.username}</h1>
                            <p style="color: var(--text-secondary); margin-bottom: 10px;">${perfil.email}</p>
                            <span class="plan-badge" style="display: inline-block; padding: 6px 16px; background: linear-gradient(135deg, #333, #555); border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #fff;">
                                💎 Plan ${perfil.plan}
                            </span>
                        </div>
                        <div style="text-align: right;">
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">Miembro desde</p>
                            <strong>${new Date(perfil.fecha_registro).toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' })}</strong>
                        </div>
                    </div>
                    
                    <!-- Estadísticas -->
                    <h2 style="margin-bottom: 20px;">📊 Mis Estadísticas</h2>
                    <div class="grid-container" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 40px;">
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 8px;">Total gastado</p>
                            <h2 style="font-size: 2rem; color: var(--text-primary);">${formatearEuro(stats.gasto_total)}</h2>
                        </div>
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 8px;">Compras</p>
                            <h2 style="font-size: 2rem; color: var(--text-primary);">${stats.compras.total}</h2>
                        </div>
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 8px;">Tutoriales completados</p>
                            <h2 style="font-size: 2rem; color: var(--text-primary);">${stats.progreso.completados}</h2>
                        </div>
                        <div class="card" style="text-align: center;">
                            <p style="color: var(--text-secondary); margin-bottom: 8px;">Progreso medio</p>
                            <h2 style="font-size: 2rem; color: var(--text-primary);">${stats.progreso.promedio}%</h2>
                        </div>
                    </div>
                    
                    <!-- Suscripción -->
                    <h2 style="margin-bottom: 20px;" id="suscripcion">💎 Mi Suscripción</h2>
                    <div class="card" style="margin-bottom: 40px;">
                        ${suscripcion ? `
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
                                <div>
                                    <h3>Plan ${suscripcion.plan_nombre}</h3>
                                    <p style="color: var(--text-secondary);">${suscripcion.caracteristicas.length} características incluidas</p>
                                </div>
                                <div style="text-align: right;">
                                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Próximo pago</p>
                                    <strong style="font-size: 1.2rem;">${formatearEuro(suscripcion.precio)}/mes</strong>
                                </div>
                            </div>
                        ` : `
                            <div style="text-align: center; padding: 20px;">
                                <p style="color: var(--text-secondary); margin-bottom: 20px;">No tienes ninguna suscripción activa</p>
                                <a href="classes.html" class="btn">Ver Planes</a>
                            </div>
                        `}
                    </div>
                    
                    <!-- Compras -->
                    <h2 style="margin-bottom: 20px;" id="compras">🛍️ Mis Compras</h2>
                    <div class="card">
                        ${compras.length === 0 ? `
                            <div style="text-align: center; padding: 40px;">
                                <p style="color: var(--text-secondary); margin-bottom: 20px;">Aún no has comprado nada</p>
                                <a href="shop.html" class="btn">Ir al Shop</a>
                            </div>
                        ` : compras.map(c => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color);">
                                <div>
                                    <strong>${c.producto_nombre}</strong>
                                    <p style="font-size: 0.85rem; color: var(--text-secondary);">
                                        ${new Date(c.fecha_compra).toLocaleDateString('es-ES')} · ${c.producto_categoria}
                                    </p>
                                </div>
                                <div style="text-align: right;">
                                    <strong>${formatearEuro(c.precio_pagado)}</strong>
                                    <p style="font-size: 0.8rem; color: ${c.estado === 'completado' ? '#22c55e' : '#ff5555'};">
                                        ${c.estado}
                                    </p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <h1>❌ Error</h1>
                        <p style="color: var(--text-secondary);">${err.message}</p>
                    </div>
                `;
            }
        });
    </script>
    <script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
