<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-card {
            background: #111;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #222;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .profile-header .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #0a0e17;
            transition: all 0.3s ease;
        }
        .profile-header .info h2 {
            color: #fff;
            margin-bottom: 5px;
        }
        .profile-header .info .role-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .profile-header .info .desc {
            color: #7a8aa3;
            margin-top: 8px;
            font-style: italic;
        }
        .profile-body {
            margin-top: 20px;
        }
        .profile-body .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .profile-body .stat span:first-child {
            color: #7a8aa3;
        }
        .profile-body .stat span:last-child {
            color: #fff;
            font-weight: bold;
        }
        .edit-section {
            background: #0a0e17;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .edit-section label {
            display: block;
            color: #7a8aa3;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .edit-section input,
        .edit-section textarea {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .edit-section textarea {
            min-height: 80px;
            resize: vertical;
        }
        .edit-section .btn-save {
            padding: 10px 30px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .edit-section .btn-save:hover {
            background: #00cc66;
        }
        .edit-section .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            display: block;
            background: #1a3a2e;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .message.error {
            display: block;
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
        }
        .redes {
            margin-top: 30px;
        }
        .image-upload-preview {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: #0a0e17;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .image-upload-preview .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .image-upload-preview .preview-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
            background: #111;
        }
        .image-upload-preview .preview-box span {
            color: #7a8aa3;
            font-size: 0.7rem;
        }
        .image-upload-preview .url-input {
            flex: 1;
            min-width: 200px;
        }
        .image-upload-preview .url-input input {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            font-family: inherit;
        }
        .image-upload-preview .url-input input:focus {
            border-color: #00ff88;
            outline: none;
        }
        .image-upload-preview .url-input .hint {
            color: #555;
            font-size: 0.7rem;
            margin-top: 4px;
        }
        .btn-reset-image {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-reset-image:hover {
            background: #ff4444;
            color: #fff;
        }
        .btn-back {
            background: transparent;
            border: 1px solid #7a8aa3;
            color: #7a8aa3;
            padding: 6px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 10px;
        }
        .btn-back:hover {
            background: #7a8aa3;
            color: #000;
        }
    </style>
</head>
