<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Profile - SoPrimico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
</head>
<script type="module" src="auth.js"></script>

<body>

<header class="headerhere">
    <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
    <h1>SoPrimico</h1>
    <div class="buttonsrn" id="menu"></div>
</header>

<div class="TOTR">
    <h1>PROFILE</h1>
    <div id="info" style="text-align:left;max-width:500px;margin:0 auto;padding:20px;background:#111;border-radius:10px;border:1px solid #222;">
        Cargando perfil...
    </div>
</div>

<div class="redes">
    <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
    <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
    <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
</div>

<script type="module">
    import { getCurrentUser, logoutUser } from './auth.js';

    // Proteger página - si no hay usuario, redirigir a login
    const user = getCurrentUser();
    if (!user) {
        window.location.href = 'login.html';
    }

    const API_URL = 'https://registration-remind-actor-linda.trycloudflare.com/api/';

    // Función para obtener monedas del usuario
    async function getCoins(userId) {
        try {
            const response = await fetch(`${API_URL}/get_coins.php?id=${userId}`);
            const data = await response.json();
            if (data.success) {
                return data.monedas;
            } else {
                console.error('Error al obtener monedas:', data.error);
                return 0;
            }
        } catch (error) {
            console.error('Error de conexión:', error);
            return 0;
        }
    }

    // Función para formatear fecha
    function formatearFecha(fecha) {
        if (!fecha) return 'No disponible';
        try {
            const fechaObj = new Date(fecha.includes('Z') ? fecha : fecha + 'Z');
            if (isNaN(fechaObj.getTime())) return 'No disponible';
            return fechaObj.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch (e) {
            return 'No disponible';
        }
    }

    // Mostrar perfil con monedas reales
    async function mostrarPerfil() {
        const info = document.getElementById('info');
        const monedas = await getCoins(user.id);

        info.innerHTML = `
            <div style="text-align:center;margin-bottom:20px;">
                <img src="imgs/S_Soprimico.png" alt="Profile" style="width:80px;border-radius:50%;border:2px solid #00ff88;">
                <h2 style="color:#00ff88;margin-top:10px;">${user.nombre}</h2>
            </div>
            
            <div style="border-top:1px solid #222;padding-top:15px;">
                <p style="color:#7a8aa3;margin:8px 0;"><strong style="color:#fff;">Email:</strong> ${user.email}</p>
                <p style="color:#7a8aa3;margin:8px 0;"><strong style="color:#fff;">ID:</strong> <span style="color:#00ff88;">#${user.id}</span></p>
                <p style="color:#7a8aa3;margin:8px 0;"><strong style="color:#fff;">Monedas:</strong> <span style="color:#00ff88;">${monedas}</span></p>
                <p style="color:#7a8aa3;margin:8px 0;">
                    <strong style="color:#fff;">Fecha registro:</strong> 
                    <span style="color:#00ff88;">${formatearFecha(user.fecha_registro)}</span>
                </p>
            </div>

            <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <button onclick="window.location.href='index.html'" style="background:#00ff88;color:#000;border:none;padding:10px 25px;border-radius:5px;cursor:pointer;font-weight:bold;">
                    Volver al Inicio
                </button>

            </div>
        `;

        // ✅ Asignar evento al botón de cerrar sesión
    }

    mostrarPerfil();
</script>

</body>
</html>
