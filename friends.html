<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Friends</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .friends-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            background: #0a0e17;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        .search-box input:focus {
            border-color: #00ff88;
        }
        .search-box button {
            padding: 10px 25px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-box button:hover {
            background: #00cc66;
        }
        .result-item {
            background: #0a0e17;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }
        .result-item .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .result-item .user-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }
        .result-item .user-info .name {
            color: #fff;
        }
        .result-item .user-info .email {
            color: #7a8aa3;
            font-size: 0.8rem;
        }
        .result-item button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 4px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .result-item button:hover {
            background: #00ff88;
            color: #000;
        }
        .result-item button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .friend-card {
            background: #111;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 10px 0;
            border: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .friend-card .info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .friend-card .info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }
        .friend-card .info .name {
            color: #fff;
            font-weight: bold;
        }
        .friend-card .info .email {
            color: #7a8aa3;
            font-size: 0.8rem;
        }
        .friend-card button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .friend-card button:hover {
            background: #00ff88;
            color: #000;
        }
        .friend-card button.remove {
            border-color: #ff4444;
            color: #ff4444;
        }
        .friend-card button.remove:hover {
            background: #ff4444;
            color: #fff;
        }
        .loading, .empty {
            text-align: center;
            padding: 30px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #1a0a0a;
            border-radius: 10px;
            border: 1px solid #ff4444;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            display: block;
            background: #1a3a2e;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .message.error {
            display: block;
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .redes {
            margin-top: 30px;
        }
        .section-title {
            color: #00ff88;
            margin: 20px 0 10px 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>
<script src="background.js"></script>


<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>FRIENDS</h1>
    </div>

    <div class="friends-container">
        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search users by name or email...">
            <button id="searchBtn">Search</button>
        </div>
        <div id="searchResults"></div>
        <div id="searchMessage" class="message"></div>

        <!-- Friends List -->
        <h2 class="section-title">Your Friends</h2>
        <div id="friendsList">
            <div class="loading">Loading friends...</div>
        </div>

        <!-- Pending Requests -->
        <h2 class="section-title">Pending Requests</h2>
        <div id="requestsList">
            <div class="loading">Loading requests...</div>
        </div>
    </div>

    <div class="redes">
        <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
