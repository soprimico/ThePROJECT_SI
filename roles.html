<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Roles</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .roles-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .role-card {
            background: #111;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s;
        }
        .role-card:hover {
            border-color: #00ff88;
        }
        .role-card .info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .role-card .info .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .role-card .info .role-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .role-card .info .role-level {
            color: #7a8aa3;
            font-size: 0.8rem;
        }
        .role-card .status {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .role-card .status.equipped {
            background: #00ff88;
            color: #000;
        }
        .role-card .status.locked {
            background: #333;
            color: #7a8aa3;
        }
        .role-card .status.available {
            background: #444;
            color: #fff;
        }
        .role-card button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .role-card button:hover {
            background: #00ff88;
            color: #000;
        }
        .role-card button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .role-card button:disabled:hover {
            background: transparent;
            color: #00ff88;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #1a0a0a;
            border-radius: 10px;
            border: 1px solid #ff4444;
        }
        .user-level {
            text-align: center;
            padding: 20px;
            background: #111;
            border-radius: 10px;
            border: 1px solid #00ff88;
            margin-bottom: 30px;
        }
        .user-level span {
            color: #00ff88;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>ROLES</h1>
    </div>

    <div class="roles-container">
        <div id="userLevel" class="user-level">
            Loading level...
        </div>
        <div id="rolesContainer">
            <div class="loading">Loading roles...</div>
        </div>
    </div>
