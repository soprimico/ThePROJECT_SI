<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-card {
            background: #111;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #222;
            margin-bottom: 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .profile-header .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
            background: #0a0e17;
        }
        .profile-header .info h2 {
            color: #fff;
            margin-bottom: 5px;
        }
        .profile-header .info .role-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .profile-header .info .desc {
            color: #7a8aa3;
            margin-top: 8px;
            font-style: italic;
        }
        .profile-body {
            margin-top: 20px;
        }
        .profile-body .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .profile-body .stat span:first-child {
            color: #7a8aa3;
        }
        .profile-body .stat span:last-child {
            color: #fff;
            font-weight: bold;
        }
        .edit-section {
            background: #0a0e17;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .edit-section label {
            display: block;
            color: #7a8aa3;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .edit-section input,
        .edit-section textarea {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .edit-section textarea {
            min-height: 80px;
            resize: vertical;
        }
        .edit-section .btn-save {
            padding: 10px 30px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .edit-section .btn-save:hover {
            background: #00cc66;
        }
        .edit-section .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            display: block;
            background: #1a3a2e;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .message.error {
            display: block;
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
        }
        .btn-edit-toggle {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-edit-toggle:hover {
            background: #00ff88;
            color: #000;
        }
        .redes {
            margin-top: 30px;
        }
        .image-upload-preview {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: #0a0e17;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .image-upload-preview .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .image-upload-preview .preview-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
            background: #111;
        }
        .image-upload-preview .preview-box span {
            color: #7a8aa3;
            font-size: 0.7rem;
        }
        .image-upload-preview .url-input {
            flex: 1;
            min-width: 200px;
        }
        .image-upload-preview .url-input input {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            font-family: inherit;
        }
        .image-upload-preview .url-input input:focus {
            border-color: #00ff88;
            outline: none;
        }
        .image-upload-preview .url-input .hint {
            color: #555;
            font-size: 0.7rem;
            margin-top: 4px;
        }
        .btn-reset-image {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-reset-image:hover {
            background: #ff4444;
            color: #fff;
        }
        .btn-back {
            background: transparent;
            border: 1px solid #7a8aa3;
            color: #7a8aa3;
            padding: 6px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 10px;
        }
        .btn-back:hover {
            background: #7a8aa3;
            color: #000;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>PROFILE</h1>
    </div>

    <div class="profile-container" id="profileContainer">
        <div class="loading">Loading profile...</div>
    </div>

    <div class="redes">
        <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
    </div>

    <script type="module">
        import { getCurrentUser } from './auth.js';

        const API_URL = 'https://registration-remind-actor-linda.trycloudflare.com/api';
        const user = getCurrentUser();

        if (!user) {
            alert('Please login to view profiles');
            window.location.href = 'login.html';
        }

        // Obtener ID de la URL (si existe)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('user_id') || user.id;
        const isOwnProfile = parseInt(targetUserId) === parseInt(user.id);

        let isEditing = false;
        let currentProfileData = {};

        // ============================================
        // LOAD PROFILE
        // ============================================
        async function loadProfile() {
            const container = document.getElementById('profileContainer');
            container.innerHTML = '<div class="loading">Loading profile...</div>';

            try {
                const response = await fetch(`${API_URL}/get_profile.php?user_id=${targetUserId}`);
                const data = await response.json();

                if (!data.success) {
                    container.innerHTML = `<div class="error-msg">Error: ${data.error}</div>`;
                    return;
                }

                currentProfileData = data.data;
                renderProfile(currentProfileData, isOwnProfile);

            } catch (error) {
                container.innerHTML = `<div class="error-msg">Error loading profile: ${error.message}</div>`;
            }
        }

        // ============================================
        // RENDER PROFILE
        // ============================================
        function renderProfile(profile, isOwn) {
            const container = document.getElementById('profileContainer');
            
            // ✅ Usar el rango del perfil que estamos viendo (NO del usuario logueado)
            const roleColor = profile.rol_color || '#00ff88';
            const roleName = profile.rol_nombre || 'Member';

            const avatarUrl = profile.imagen_perfil || 'imgs/default-profile.png';
            const desc = profile.descripcion || 'No description yet.';

            const backButton = !isOwn ? `<button class="btn-back" onclick="window.history.back()">← Back</button>` : '';
            const editButton = isOwn ? `<button class="btn-edit-toggle" id="toggleEditBtn">Edit Profile</button>` : '';

            container.innerHTML = `
                <div class="profile-card">
                    <div class="profile-header">
                        <img src="${avatarUrl}" alt="${profile.nombre}" class="avatar" id="avatarPreview" onerror="this.src='imgs/default-profile.png'">
                        <div class="info">
                            <h2>${profile.nombre}</h2>
                            <span class="role-tag" style="background:${roleColor};color:#000;">${roleName}</span>
                            <p class="desc" id="descDisplay">${desc}</p>
                            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                                ${backButton}
                                ${editButton}
                            </div>
                        </div>
                    </div>
                    <div class="profile-body">
                        <div class="stat"><span>Email</span><span>${profile.email}</span></div>
                        <div class="stat"><span>Level</span><span>${profile.nivel || 1}</span></div>
                        <div class="stat"><span>Coins</span><span>${profile.monedas || 0}</span></div>
                        <div class="stat"><span>Member since</span><span>${new Date(profile.fecha_registro).toLocaleDateString('es-ES')}</span></div>
                    </div>
                </div>

                ${isOwn ? `
                <div class="profile-card edit-section" id="editSection" style="display:none;">
                    <h3 style="color:#00ff88;margin-bottom:15px;">Edit Profile</h3>
                    
                    <label>Profile Picture</label>
                    <div class="image-upload-preview">
                        <div class="preview-box">
                            <img src="${avatarUrl}" alt="Preview" id="editAvatarPreview" onerror="this.src='imgs/default-profile.png'">
                            <span>Preview</span>
                        </div>
                        <div class="url-input">
                            <input type="text" id="editImageUrl" placeholder="Paste image URL here (e.g. https://example.com/avatar.png)" value="${profile.imagen_perfil || ''}">
                            <div class="hint">Supports any external image URL (PNG, JPG, GIF, etc.)</div>
                        </div>
                        <button class="btn-reset-image" id="resetImageBtn">Reset to default</button>
                    </div>

                    <label>Description</label>
                    <textarea id="editDesc" placeholder="Write something about yourself...">${profile.descripcion || ''}</textarea>

                    <button class="btn-save" id="saveProfileBtn">Save Changes</button>
                    <div id="editMessage" class="message"></div>
                </div>
                ` : ''}
            `;

            if (isOwn) {
                const toggleBtn = document.getElementById('toggleEditBtn');
                const saveBtn = document.getElementById('saveProfileBtn');
                const resetBtn = document.getElementById('resetImageBtn');
                const imageInput = document.getElementById('editImageUrl');

                if (toggleBtn) toggleBtn.addEventListener('click', toggleEdit);
                if (saveBtn) saveBtn.addEventListener('click', saveProfile);
                if (resetBtn) resetBtn.addEventListener('click', resetImage);
                
                if (imageInput) {
                    imageInput.addEventListener('input', function() {
                        const url = this.value.trim();
                        const preview = document.getElementById('editAvatarPreview');
                        if (url) {
                            preview.src = url;
                            preview.onerror = function() {
                                this.src = 'imgs/default-profile.png';
                            };
                        } else {
                            preview.src = 'imgs/default-profile.png';
                        }
                    });
                }
            }
        }

        // ============================================
        // TOGGLE EDIT
        // ============================================
        function toggleEdit() {
            const editSection = document.getElementById('editSection');
            const btn = document.getElementById('toggleEditBtn');
            
            isEditing = !isEditing;
            editSection.style.display = isEditing ? 'block' : 'none';
            btn.textContent = isEditing ? '❌ Cancel Edit' : '✏️ Edit Profile';
        }

        // ============================================
        // RESET IMAGE
        // ============================================
        function resetImage() {
            document.getElementById('editImageUrl').value = '';
            document.getElementById('editAvatarPreview').src = 'imgs/default-profile.png';
        }

        // ============================================
        // SAVE PROFILE
        // ============================================
        async function saveProfile() {
            const btn = document.getElementById('saveProfileBtn');
            const message = document.getElementById('editMessage');
            
            const descripcion = document.getElementById('editDesc').value.trim();
            const imagenPerfil = document.getElementById('editImageUrl').value.trim();

            btn.disabled = true;
            message.className = 'message';
            message.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/update_profile.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        descripcion: descripcion || null,
                        imagen_perfil: imagenPerfil || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'message success';
                    message.style.display = 'block';
                    message.textContent = '✅ Profile updated successfully!';
                    
                    if (descripcion) currentProfileData.descripcion = descripcion;
                    if (imagenPerfil) currentProfileData.imagen_perfil = imagenPerfil;
                    
                    if (imagenPerfil) {
                        document.getElementById('avatarPreview').src = imagenPerfil;
                    } else {
                        document.getElementById('avatarPreview').src = 'imgs/default-profile.png';
                    }
                    
                    setTimeout(() => {
                        loadProfile();
                    }, 1000);
                } else {
                    message.className = 'message error';
                    message.style.display = 'block';
                    message.textContent = '❌ Error: ' + data.error;
                }
            } catch (error) {
                message.className = 'message error';
                message.style.display = 'block';
                message.textContent = '❌ Error: ' + error.message;
            } finally {
                btn.disabled = false;
            }
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadProfile();
    </script>
</body>
</html>
