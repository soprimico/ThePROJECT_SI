<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Help</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .help-container {
            text-align: center;
            margin-top: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            background: #111;
            border-radius: 10px;
            border: 1px solid #222;
        }

        .help-container input,
        .help-container textarea {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: inherit;
            resize: vertical;
        }

        .help-container textarea {
            min-height: 120px;
        }

        .help-container button {
            padding: 12px 40px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #000000;
            color: #00ff88;
            border: 1px solid #00ff88;
            font-weight: bold;
            transition: all 0.3s;
        }

        .help-container button:hover {
            background-color: #00ff88;
            color: #000000;
            transform: scale(1.05);
        }

        .help-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        #mensaje.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #mensaje.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>
<script src="background.js"></script>


<body>

    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>HELP</h1>
    </div>

    <div class="help-container">
        <h3 style="color:#00ff88;margin-bottom:20px;">Contacta con nosotros</h3>

        <input type="text" id="nombre" placeholder="Tu nombre (opcional)">

        <input type="email" id="email" placeholder="Tu email (opcional)">

        <textarea id="mensajeTexto" placeholder="Describe tu problema o consulta..."></textarea>

        <button id="btnEnviar">Enviar</button>

        <div id="mensaje"></div>
    </div>

    <div class="redes" style="margin-top:40px;">
        <a href="https://discord.gg/Yscc4Ghf9v" target="_blank">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico" target="_blank">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/" target="_blank">INSTAGRAM</a>
    </div>
