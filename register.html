


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
</head>
<style>
    input{
        background-color: #000000;
        color: #fff;
    }
</style>
<script type="module" src="auth.js"></script>


<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="register-wrapper">

    <div class="register-card">

        <img
            src="imgs/S_Soprimico.png"
            alt="SoPrimico"
            class="register-logo"
        >

        <h2>Create Account</h2>

        <p class="register-subtitle">
            Join the SoPrimico community.
        </p>

        <form id="form">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="hidden"
                id="coins"
                value="100"
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div id="resultado"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>
        <p style="color:white">YOU HAVE 2 TRIES OF REGISTRING PER HOUR!</p>

    </div>

</div>

        <div class="redes">
            <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
            <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
            <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
        </div>
        <script type="module">
            import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const supabase = createClient(
    "https://frkmqrgbjeljgzaeodlu.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZya21xcmdiamVsamd6YWVvZGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyMTAzNTYsImV4cCI6MjA4Njc4NjM1Nn0.pFlFPQhYJ0I9lsCPDI4PcSKZrXUpvHTBQq8lLcR3sDE"
);


const form = document.getElementById("form");
const result = document.getElementById("resultado");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const username =
        document.getElementById("username").value.trim();

    const coins =
        Number(document.getElementById("coins").value);

    try {

        const { data, error } =
            await supabase.auth.signUp({
                email,
                password
            });

        if (error) throw error;

        if (!data.user) {
            throw new Error("User could not be created.");
        }

        const { error: profileError } =
            await supabase
                .from("profiles")
                .insert({
                    id: data.user.id,
                    email,
                    username,
                    coins
                });

        if (profileError) throw profileError;

        result.textContent =
            "✅ Account created successfully!";

        form.reset();

    } catch (err) {

        console.error(err);

        result.textContent =
            "❌ " + err.message;
    }
});
        </script>
</body>
</html>
