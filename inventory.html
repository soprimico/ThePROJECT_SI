<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoPrimico - Inventory</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="imgs/S_Soprimico.png" />
    <style>
        /* Reset / base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f16;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8f0f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .headerhere {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(10, 14, 23, 0.9);
            border-bottom: 1px solid rgba(0, 180, 255, 0.06);
            flex-wrap: wrap;
            gap: 12px;
        }
        .headerhere img {
            height: 40px;
        }
        .headerhere h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00ff88;
            letter-spacing: 2px;
        }
        .buttonsrn {
            display: flex;
            gap: 12px;
        }

        /* Título */
        .titulo-ea {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .titulo-ea h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: #d0dce8;
            border-bottom: 1px solid rgba(0, 255, 136, 0.08);
            display: inline-block;
            padding-bottom: 8px;
        }

        /* INVENTORY CONTAINER — con FLEX-WRAP */
        .inventory-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        /* Cards wrapper: flex-wrap, centrado, gap */
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            width: 100%;
        }

        /* Cada tarjeta: base flexible, ancho mínimo 260px, max 320px */
        .card {
            background: rgba(10, 14, 23, 0.85);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(0, 180, 255, 0.04);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            flex: 1 1 260px;          /* ← crece, encoge, base 260px */
            max-width: 320px;
            min-width: 200px;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }

        .card h3 {
            color: #00ff88;
            font-size: 1.2rem;
            margin: 0;
        }
        .card p {
            color: #7a8aa3;
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }
        .card .fecha {
            color: #555;
            font-size: 0.8rem;
        }
        .card img {
            width: 100%;
            max-width: 200px;
            height: 140px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
        }
        .badge-owner {
            background: #00ff88;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .card button {
            background: transparent;
            border: 1px solid rgba(0, 180, 255, 0.1);
            color: #d0dce8;
            font-weight: 400;
            font-size: 0.8rem;
            padding: 10px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 140px;
            letter-spacing: 3px;
            font-family: 'SF Mono', 'Consolas', monospace;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .card button:hover {
            background: rgba(0, 255, 136, 0.03);
            border-color: rgba(0, 255, 136, 0.2);
            color: #e8f0f8;
            transform: scale(1.02);
        }

        .empty {
            text-align: center;
            padding: 60px;
            color: #7a8aa3;
        }
        .empty a {
            color: #00ff88;
            text-decoration: none;
        }
        .empty a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #1a0a0a;
            border-radius: 10px;
            border: 1px solid #ff4444;
        }

        /* Redes sociales (footer) */
        .redes {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 30px 20px 20px;
            border-top: 1px solid rgba(0, 180, 255, 0.04);
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .redes a {
            color: #7a8aa3;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .redes a:hover {
            color: #00ff88;
        }

        /* ── responsive extra: pantallas muy pequeñas ── */
        @media (max-width: 480px) {
            .card {
                flex: 1 1 100%;        /* ocupa todo el ancho */
                max-width: 100%;
                min-width: 0;
            }
            .headerhere {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .titulo-ea h1 {
                font-size: 1.6rem;
                letter-spacing: 4px;
            }
            .redes {
                gap: 16px;
            }
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo" />
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>INVENTORY</h1>
    </div>

    <div class="inventory-container">
        <div id="inventoryContainer">
            <div class="loading">Loading inventory...</div>
        </div>
    </div>

    <div class="redes">
        <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
    </div>

    <script type="module">
        import { getCurrentUser } from './auth.js';

        const API_URL = 'https://registration-remind-actor-linda.trycloudflare.com/api';

        const user = getCurrentUser();
        if (!user) {
            alert('Please login to view your inventory');
            window.location.href = 'login.html';
        }

        // ============================================
        // MAP PRODUCT NAMES TO PAGES
        // ============================================
        function getProductPage(nombre) {
            const map = {
                'OSINT Script': 'osint.html',
                'Spotify Hack': 'spotify.html',
                'MAC Changer': 'macC.html',
                'Evil-WinRM': 'evil-winrm.html',
                'Wifite': 'wifite.html',
                'Aircrack-ng': 'aircrack.html',
                'Secure Chat Access': 'priv-serv.html'
            };
            return map[nombre] || null;
        }

        async function loadInventory() {
            const container = document.getElementById('inventoryContainer');

            try {
                const response = await fetch(`${API_URL}/get_inventory.php?user_id=${user.id}`);
                const data = await response.json();

                if (!data.success) {
                    container.innerHTML = `<div class="error-msg">ERROR: ${data.error}</div>`;
                    return;
                }

                if (data.data.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <p>You don't have any products yet.</p>
                            <p>Go to the <a href="shop.html">Shop</a> to buy some!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="cards">
                        ${data.data.map(item => {
                            const page = getProductPage(item.nombre);
                            return `
                                <div class="card">
                                    <span class="badge-owner">OWNED</span>
                                    <h3>${item.nombre}</h3>
                                    <p>${item.descripcion}</p>
                                    <img src="${item.imagen}" alt="${item.nombre}" />
                                    <p class="fecha">Purchased: ${new Date(item.fecha_compra).toLocaleDateString('es-ES')}</p>
                                    ${page ? `<button onclick="window.location.href='${page}'">View</button>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">Error loading inventory: ${error.message}</div>`;
            }
        }

        loadInventory();
    </script>
</body>
</html>
