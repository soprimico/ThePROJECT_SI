<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoPrimico - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/S_Soprimico.png">
    <style>
        .chat-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            height: 75vh;
        }
        .sidebar {
            width: 280px;
            background: #111;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #222;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .sidebar .user-item {
            padding: 10px 12px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #7a8aa3;
        }
        .sidebar .user-item:hover {
            background: #1a1a2e;
            color: #fff;
        }
        .sidebar .user-item.active {
            background: #1a1a2e;
            border-left: 3px solid #00ff88;
            color: #fff;
        }
        .sidebar .user-item .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .sidebar .user-item .status.online {
            background: #00ff88;
        }
        .sidebar .user-item .status.offline {
            background: #555;
        }
        .chat-main {
            flex: 1;
            background: #111;
            border-radius: 12px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header .chat-title {
            color: #00ff88;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-messages .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }
        .chat-messages .message .msg-user {
            font-size: 0.75rem;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 3px;
        }
        .chat-messages .message .msg-time {
            font-size: 0.6rem;
            color: #555;
            margin-left: 8px;
        }
        .chat-messages .message.own {
            align-self: flex-end;
            background: #1a3a2e;
            border: 1px solid #00ff88;
        }
        .chat-messages .message.other {
            align-self: flex-start;
            background: #1a1a2e;
            border: 1px solid #333;
        }
        .chat-messages .message.system {
            align-self: center;
            background: transparent;
            color: #555;
            font-size: 0.8rem;
            font-style: italic;
            border: none;
        }
        .chat-input {
            padding: 15px 20px;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 15px;
            background: #0a0e17;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        .chat-input input:focus {
            border-color: #00ff88;
        }
        .chat-input button {
            padding: 10px 25px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input button:hover {
            background: #00cc66;
        }
        .chat-input button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .empty-chat {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #555;
            font-style: italic;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar .section-title {
            color: #7a8aa3;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 8px 0;
        }
        .friend-request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin: 3px 0;
            background: #1a0a0a;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .friend-request-item button {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .friend-request-item button:hover {
            background: #00ff88;
            color: #000;
        }
        .friend-request-item button.reject {
            border-color: #ff4444;
            color: #ff4444;
        }
        .friend-request-item button.reject:hover {
            background: #ff4444;
            color: #fff;
        }
        .redes {
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7a8aa3;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            color: #ff4444;
        }
    </style>
</head>
<script type="module" src="auth.js"></script>

<body>
    <header class="headerhere">
        <img src="imgs/Soprimicologo.png" alt="SoPrimico Logo">
        <h1>SoPrimico</h1>
        <div class="buttonsrn" id="menu"></div>
    </header>

    <div class="titulo-ea">
        <h1>CHAT</h1>
    </div>

    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <h3>General</h3>
            <div class="user-item active" data-type="general" data-id="0" onclick="selectChat('general', 0, 'General')">
                # General Chat
            </div>

            <h3 style="margin-top:20px;">Friends</h3>
            <div id="friendsList">
                <div class="loading">Loading friends...</div>
            </div>

            <h3 style="margin-top:20px;">Friend Requests</h3>
            <div id="friendRequests">
                <div class="loading">Loading requests...</div>
            </div>

            <div style="margin-top:20px;border-top:1px solid #222;padding-top:15px;">
                <button onclick="location.href='friends.html'" style="width:100%;padding:10px;background:#00ff88;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">
                    Manage Friends
                </button>
            </div>
        </div>

        <!-- Chat Main -->
        <div class="chat-main">
            <div class="chat-header">
                <span class="chat-title" id="chatTitle"># General Chat</span>
                <span style="color:#555;font-size:0.8rem;" id="chatUsers">0 users online</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">No messages yet. Start the conversation!</div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <div class="redes">
        <a href="https://discord.gg/Yscc4Ghf9v">DISCORD</a>
        <a href="https://www.youtube.com/@soprimico">YOUTUBE</a>
        <a href="https://www.instagram.com/soprimico/">INSTAGRAM</a>
    </div>
